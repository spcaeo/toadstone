name: Bug report
description: Something behaves differently from how it is documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security problem, close this and use
        [a private advisory](https://github.com/spcaeo/toadstone/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        I crawled https://example.com with JavaScript rendering on.
        I expected ... and instead ...
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: >
        The smallest version that still shows the problem. If a particular page
        triggers it, paste the HTML rather than the URL — a URL changes under us,
        HTML does not.
    validations: {required: true}
  - type: input
    id: check
    attributes:
      label: Which check, if it is a finding
      description: The `check` slug from the finding, e.g. `canonical_cross_domain`. Paste its `evidence` block too.
  - type: textarea
    id: env
    attributes:
      label: Environment
      value: |
        - Toadstone version or commit:
        - Install: Docker / Python
        - OS:
        - Python version (if not Docker):
        - Browser (if it is a UI problem):
    validations: {required: true}
  - type: checkboxes
    id: checks
    attributes:
      label: Before you post
      options:
        - label: I searched the existing issues
          required: true
        - label: I am not pasting an API key, cookie or token anywhere in this report
          required: true
